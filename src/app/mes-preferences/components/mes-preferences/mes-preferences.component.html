<!-- <app-banniere></app-banniere> -->
<main class="div container">
    <div class="mesPreferences">
        <div class="mesPreferenceContent z-depth-3">
            <form [formGroup]="form" (ngSubmit)="form">
                <section class="row">
                    <article class="col-lg-12">
                        <h1>Mes préférences </h1>
                        <hr>
                    </article>
                    <article class="col-lg-12">
                        <h5>Encodage du traitement</h5>

                        <div class="radio-toggle">
                           <input type="radio" id="surface" formControlName="encodageDuTraitement" value="Surface" checked>
                            <label for="surface">Surface</label>
                        
                           <input type="radio" id="bouillie" formControlName="encodageDuTraitement" value="Bouillie" >
                            <label for="bouillie">Bouillie</label>
                        </div>   

                        <h5>Type de pulvérisateur</h5>
                            <label>
                                <input type="checkbox" formControlName="typeDePulverisateur" />
                                <span>J’utilise un pulvérisateur de plus de 20 L.</span>
                            </label>
                            <!-- <div class="form-check">

                                <input class="form-check-input" type="checkbox" id="pulvérisateur" formControlName="typeDePulverisateur">
                                    <label class="form-check-label" for="pulvérisateur">
                                        J’utilise un pulvérisateur de plus de 20 L.
                                    </label>
                            </div> -->

                        <h5>Catégorie de producteur</h5>

                        <p>A quel(s) secteur(s) d’activité(s) appartenez-vous ?</p>
                        <br>
                        <p></p>
                        <div class="radios">
                            <section class="row">
                                <article class="col-lg-4">
                                    <div class="selection">
                                        <label>Grandes cultures</label>
                                        <select multiple  formControlName="grandesCultures">
                                            <option value="Betterave et chicorée"> Betterave et chicorée </option>   
                                            <option value="Céréales de printemps"> Céréales de printemps </option>   
                                            <option value="Céréales d'hiver"> Céréales d'hiver </option>   
                                            <option value="Légumes de plein champ"> Légumes de plein champ </option>   
                                            <option value="Maïs"> Maïs </option>   
                                            <option value="Pommes de terre"> Pommes de terre </option>   
                                        </select>
                                    </div>

                                </article>
                                <article class="col-lg-4">
                                    <div class="selection">
                                        <label>Maraichage</label>
                                        <select multiple  formControlName="maraichage">
                                            <option value="Maraichage"> Maraichage</option>   
                                            <option value="Fraises et petits fruits"> Fraises et petits fruits </option>   
                                        </select>
                                    </div>
                                </article>
                                <article class="col-lg-4">
                                    <div class="selection">
                                        <label>Cultures fourragères</label>
                                        <select multiple  formControlName="culturesFourrageres">
                                            <option value="Protéagineux"> Protéagineux</option>   
                                            <option value="Oléagineux"> Oléagineux </option>   
                                        </select>
                                    </div>
                                </article>
                                <article class="col-lg-4">
                                    <div class="selection" >
                                        <label>Plantes ornementales</label>
                                        <select multiple  formControlName="plantesOrnementales" >
                                            <option value="Pépinières"> Pépinières</option>
                                            <option value="Plantes fleuries"> Plantes fleuries</option>
                                            <option value="Espaces vertes"> Espaces vertes</option>
                                        </select>
                                    </div>
                                </article>
                                <article class="col-lg-4">
                                    <div class="selection" >
                                        <label>Arboriculture et viticulture</label>
                                        <select multiple  formControlName="arboriculture" >
                                            <option value="Pommiers"> Pommiers</option>
                                            <option value="Poirers"> Poirers</option>
                                            <option value="Autres arbres fruitiers"> Autres arbres fruitiers</option>
                                            <option value="Raisins de table"> Raisins de table</option>
                                            <option value="Vignes"> Vignes</option>
                                        </select>
                                    </div>

                                    
                                </article>
                                <article class="col-lg-4">
                                    <div class="selection" >
                                        <label>Pépinières forestières et sapins de Noël</label>
                                        <select multiple  formControlName="pepinieresForestieresEtViticultureSapinsDeNoel" >
                                            <option value="Pépinières forestières"> Pépinières forestières</option>
                                            <option value="Sapins de Noël"> Sapins de Noël</option>
                                        </select>
                                    </div>
                                </article>
                            </section>
                        </div>
                    </article>
                    <article class="col-lg-12">
                        <div class="bouton">
                            <div class="annuler" >
                                <p><button class="btn btn-danger" (click)="onAnnuler()">Annuler</button></p>
                            </div>
                            <div class="suivant">
                                <p><button class="btn btn-success" (click)="onSuivant()" [disabled]="form.invalid" >Suivant</button></p>
                            </div>
                        </div>
                    </article>
                </section>
            </form>
        </div>
    </div>
</main>
